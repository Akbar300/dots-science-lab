<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dot's Science Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sky1:#8FD8FF;--sky2:#E3F7FF;--sun:#FFC93C;--sun2:#FFB000;--leaf:#3FAE5A;--leafd:#1E6B3A;--leafl:#BFE8B0;--red:#E8382F;--redd:#B5231C;--ink:#1B3A2E;--soil:#8A5A33;--sky:#2F8FD6;--paper:#FFFFFF;
 --disp:'Fredoka','Baloo 2','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;--body:'Nunito','Avenir Next','Segoe UI',system-ui,sans-serif;--pop:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--sky2);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:4px solid var(--sun2);outline-offset:3px;border-radius:12px}

/* ---------- living world ---------- */
#world{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#7FD0FF 0%,#B9E9FF 45%,#E9FAFF 70%,#F3FFE8 100%)}
#sun{position:absolute;right:2.5vw;top:84px;width:min(120px,20vw);height:min(120px,20vw)}
#sun .rays{animation:spin 40s linear infinite;transform-origin:50% 50%;transform-box:fill-box}
#sun .face{animation:sunbob 6s ease-in-out infinite;transform-origin:50% 50%;transform-box:fill-box}
.cloud{position:absolute;opacity:.95;animation:drift linear infinite}
.cloud svg{display:block;width:100%;height:auto}
.hill{position:absolute;left:-5%;width:110%;bottom:0}
.hill svg{display:block;width:100%;height:auto}
#blades{position:absolute;left:0;right:0;bottom:0;height:120px;pointer-events:none}
.blade{position:absolute;bottom:-6px;width:16px;border-radius:50% 50% 0 0/100% 100% 0 0;transform-origin:50% 100%;animation:sway ease-in-out infinite alternate}
.flower{position:absolute;bottom:0;transform-origin:50% 100%;animation:sway 3.4s ease-in-out infinite alternate}
.bfly{position:absolute;left:0;top:0;width:44px;height:44px;offset-rotate:0deg;animation:flypath linear infinite}
.bfly svg{width:100%;height:100%;animation:flap .22s ease-in-out infinite alternate;transform-origin:50% 50%}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.walker{position:absolute;bottom:58px;left:0;width:46px;height:46px;animation:walkacross 48s linear infinite;z-index:2}
.walker .dotsvg{transform:rotate(90deg)}
@keyframes walkacross{from{transform:translateX(-80px)}to{transform:translateX(calc(100vw + 80px))}}
.wipe{position:fixed;inset:0;z-index:65;pointer-events:none;overflow:hidden}
.wipe i{position:absolute;width:62vmax;height:30vmax;background:var(--leaf);border-radius:0 100% 0 100%;box-shadow:inset -2vmax -2vmax 0 var(--leafd);animation:sweep .75s cubic-bezier(.6,0,.3,1) both}
.wipe i:nth-child(2){background:#56C06A;animation-delay:.06s}.wipe i:nth-child(3){background:#2E9A4B;animation-delay:.12s}
@keyframes sweep{from{transform:translate(-120vw,var(--y)) rotate(-25deg)}to{transform:translate(140vw,var(--y)) rotate(10deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sunbob{50%{transform:scale(1.06)}}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.35)}}
@keyframes flypath{from{offset-distance:0%}to{offset-distance:100%}}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 16px;
 background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.55));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:3px solid rgba(63,174,90,.35)}
.top .mini{width:42px;height:42px;flex:none}
.top h1{font-family:var(--disp);font-weight:700;font-size:24px;margin:0;color:var(--leafd);letter-spacing:.2px;white-space:nowrap}
.top .sp{flex:1}
.jar{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--sun);border-radius:99px;padding:4px 14px 4px 8px;font-family:var(--disp);font-weight:700;font-size:20px;box-shadow:0 3px 0 var(--sun2)}
.jar .s{width:26px;height:26px}
.jar.bump{animation:bump .5s var(--pop)}
@keyframes bump{40%{transform:scale(1.3) rotate(-6deg)}}
.tbtn{border:3px solid var(--leaf);background:#fff;border-radius:14px;padding:6px 12px;font-family:var(--disp);font-weight:600;font-size:16px;color:var(--leafd);box-shadow:0 3px 0 var(--leafd)}
.tbtn:active{transform:translateY(3px);box-shadow:none}
.tbtn svg{width:20px;height:20px;vertical-align:-4px}

/* ---------- stage ---------- */
#app{position:relative;z-index:10;max-width:1000px;margin:0 auto;padding:18px 16px 170px}
.enter{animation:enter .55s var(--pop) both}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.94)}}

/* ---------- Dot ---------- */
.dotsvg{width:100%;height:100%;overflow:visible}
.dotsvg .ant{transform-box:fill-box;transform-origin:50% 100%;animation:ant 2.2s ease-in-out infinite}
.dotsvg .ar{animation-delay:-1.1s}
.dotsvg .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 4.6s infinite}
.dotsvg .pupils{animation:look 7s ease-in-out infinite}
.dotsvg .shell{transform-box:view-box;transition:transform .35s var(--pop)}
.dotsvg .sl{transform-origin:60px 38px}.dotsvg .sr{transform-origin:60px 38px}
.dotsvg .wing{transform-box:fill-box;transform-origin:50% 0;transform:scale(0);transition:transform .3s}
.dotsvg .lg{transform-box:fill-box}
@keyframes ant{50%{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@keyframes look{0%,40%,100%{transform:translate(0,0)}50%,60%{transform:translate(2.5px,0)}70%,80%{transform:translate(-2.5px,1px)}}
.fly .dotsvg .sl{transform:rotate(-32deg) translateX(-4px)}.fly .dotsvg .sr{transform:rotate(32deg) translateX(4px)}
.fly .dotsvg .wing{transform:scale(1);animation:buzz .07s linear infinite alternate}
@keyframes buzz{to{transform:scale(1,.82)}}
.walk .dotsvg .lg{animation:leg .25s ease-in-out infinite alternate}
.walk .dotsvg .l2,.walk .dotsvg .r1,.walk .dotsvg .r3{animation-delay:-.125s}
@keyframes leg{to{transform:rotate(14deg)}}
.cheer{animation:cheer .9s var(--pop)}
@keyframes cheer{25%{transform:translateY(-34px) rotate(-10deg) scale(1.08)}55%{transform:translateY(0) rotate(8deg)}75%{transform:translateY(-12px) rotate(-4deg)}}
.think{animation:think 1s ease-in-out}
@keyframes think{30%{transform:rotate(-14deg)}60%{transform:rotate(10deg)}}

/* Dot perched on the panel */
.perch{position:absolute;right:26px;top:-74px;width:88px;height:88px;z-index:5}
.perch .who{width:100%;height:100%;cursor:pointer;filter:drop-shadow(0 6px 4px rgba(27,58,46,.25))}
#bubble{position:absolute;right:96px;top:-6px;width:max-content;max-width:280px;background:#fff;border:3px solid var(--leaf);border-radius:22px 22px 6px 22px;padding:9px 14px;font-weight:800;font-size:16px;line-height:1.3;
 box-shadow:0 5px 0 rgba(30,107,58,.35);transform-origin:100% 100%;animation:pop .45s var(--pop) both;pointer-events:none}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* ---------- home ---------- */
.hero{text-align:center;padding:26px 0 8px}
.title{font-family:var(--disp);font-weight:700;font-size:clamp(40px,7.6vw,72px);line-height:.95;margin:0;color:var(--ink);
 text-shadow:0 4px 0 var(--redd),0 9px 0 rgba(27,58,46,.18);letter-spacing:1px}
.title .w{display:inline-block;white-space:nowrap}
.title .ch{display:inline-block;animation:drop .8s var(--pop) both;cursor:default}
.title .ch.jump{animation:jump .5s var(--pop)}
@keyframes jump{40%{transform:translateY(-22px) rotate(-8deg) scale(1.1)}}
.title .lab{color:var(--leaf);text-shadow:0 4px 0 var(--leafd),0 9px 0 rgba(27,58,46,.18)}
@keyframes drop{from{transform:translateY(-120px) rotate(-20deg);opacity:0}}
.sub{font-family:var(--disp);font-weight:500;font-size:clamp(18px,3vw,24px);margin:12px auto 0;max-width:30ch}
.flydot{position:fixed;width:120px;height:120px;z-index:55;pointer-events:none}
.blooms{display:flex;flex-wrap:wrap;justify-content:center;gap:26px 30px;margin-top:34px}
.bloom{position:relative;width:200px;border:0;background:none;padding:0;text-align:center}
.bloom .head{position:relative;width:170px;height:170px;margin:0 auto}
.bloom .pet{position:absolute;left:50%;top:50%;width:58px;height:84px;margin:-84px 0 0 -29px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform-origin:50% 100%;background:#FFF0B8;box-shadow:inset 0 -6px 0 rgba(0,0,0,.06);transition:background .4s}
.bloom .pet.on{background:var(--sun);box-shadow:inset 0 -6px 0 rgba(0,0,0,.08),0 0 12px rgba(255,201,60,.6)}
.bloom .ring{position:absolute;inset:0;animation:spin 30s linear infinite}
.bloom:hover .ring{animation-duration:6s}
.bloom .core{position:absolute;inset:38px;border-radius:50%;background:#fff;border:6px solid #F59E0B;display:flex;align-items:center;justify-content:center;padding:12px;box-shadow:0 6px 0 rgba(27,58,46,.18)}
.bloom .stem{width:10px;height:60px;margin:-6px auto 0;background:var(--leaf);border-radius:8px;position:relative}
.bloom .stem:before,.bloom .stem:after{content:"";position:absolute;width:34px;height:18px;background:var(--leaf);border-radius:0 100% 0 100%;top:22px}
.bloom .stem:before{right:8px;transform:rotate(-20deg)}.bloom .stem:after{left:8px;border-radius:100% 0 100% 0;transform:rotate(20deg);top:30px}
.bloom .nm{font-family:var(--disp);font-weight:700;font-size:21px;margin-top:6px;line-height:1.1;display:table;margin-left:auto;margin-right:auto;background:rgba(255,255,255,.85);border-radius:12px;padding:3px 12px}
.bloom .ds{font-size:14px;font-weight:700;margin:4px auto 0;display:table;background:rgba(255,255,255,.75);border-radius:10px;padding:1px 10px}
.bloom.open{animation:grow 1s var(--pop) both}
.bloom.open:hover .head{animation:wob .6s ease-in-out}
@keyframes wob{30%{transform:rotate(-8deg) scale(1.05)}70%{transform:rotate(6deg)}}
@keyframes grow{from{transform:scale(.2) translateY(80px);opacity:0}}
.bloom.bud{animation:grow 1s var(--pop) both}
.bud .head{animation:sway 3.2s ease-in-out infinite alternate;transform-origin:50% 100%}
.bud.poke .budshape{animation:wob .6s ease-in-out}
.bud .zz{position:absolute;right:4px;top:6px;font-family:var(--disp);font-weight:700;color:var(--leafd);font-size:18px;animation:zz 2.6s ease-in-out infinite}
@keyframes zz{0%{transform:translate(0,10px);opacity:0}30%{opacity:1}100%{transform:translate(12px,-18px);opacity:0}}
.bud .budface{position:absolute;left:50%;top:56%;width:52px;height:30px;margin-left:-26px}
.toast{position:absolute;z-index:6;left:50%;bottom:calc(100% - 20px);transform:translateX(-50%);width:max-content;max-width:220px;background:#fff;border:3px solid var(--leaf);border-radius:18px;padding:8px 12px;font-weight:800;font-size:15px;line-height:1.3;box-shadow:0 4px 0 rgba(30,107,58,.3);animation:pop .4s var(--pop) both;pointer-events:none}
.bud .head{width:120px;height:150px}
.bud .budshape{position:absolute;left:50%;bottom:0;width:84px;height:120px;margin-left:-42px;background:radial-gradient(circle at 40% 30%,#8FD97D,#3FAE5A 70%);border-radius:50% 50% 46% 46%/62% 62% 38% 38%;box-shadow:inset -8px -6px 0 rgba(0,0,0,.08)}
.bud .budshape:before{content:"";position:absolute;left:50%;top:-10px;width:40px;height:56px;margin-left:-20px;background:var(--sun);border-radius:50% 50% 50% 50%/70% 70% 30% 30%;z-index:-1;opacity:.85}
.bud .nm,.bud .ds{color:#4E6E5C}
.berries{display:flex;gap:6px;justify-content:center;margin-top:6px}
.berry{width:16px;height:16px;border-radius:50%;background:rgba(27,58,46,.15);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.berry.on{background:radial-gradient(circle at 35% 30%,#FFE58A,var(--sun) 50%,var(--sun2));box-shadow:0 0 10px rgba(255,201,60,.9)}

/* ---------- trail map ---------- */
.trailhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 4px}
.trailhead h2{font-family:var(--disp);font-weight:700;font-size:clamp(30px,5vw,44px);margin:0;color:var(--leafd)}
.trailhead .pill{background:#fff;border:3px solid var(--sun);border-radius:99px;padding:4px 14px;font-weight:800}
.trail{position:relative;margin-top:66px}
#tdash{animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-40}}
.trail svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.stops{position:relative;display:grid;grid-template-columns:1fr 1fr;row-gap:16px;padding-bottom:120px}
.stop{grid-column:1;justify-self:center;border:0;background:none;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;width:220px;position:relative}
.stop:nth-child(even){grid-column:2;transform:translateY(118px)}
.stop .pad{width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#DFF7D2,#8FD97D 58%,#3FAE5A);border:5px solid #fff;box-shadow:0 8px 0 var(--leafd),0 14px 18px rgba(27,58,46,.25);
 display:flex;align-items:center;justify-content:center;transition:transform .25s var(--pop);position:relative;animation:float 4s ease-in-out infinite}
.stop .pad:before{content:"";position:absolute;right:18px;top:6px;width:30px;height:30px;background:rgba(255,255,255,.45);border-radius:0 50% 0 50%}
.stop .pad .ic{width:88px;height:88px}
.stop:hover .pad{transform:scale(1.1) rotate(-5deg)}
.stop:active .pad{transform:scale(.96)}
.stop .nm{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1.1;background:#fff;border-radius:14px;padding:4px 12px;box-shadow:0 3px 0 rgba(27,58,46,.15)}
.stop .ds{font-size:14px;font-weight:700;max-width:22ch;text-align:center;line-height:1.3;background:rgba(255,255,255,.75);border-radius:10px;padding:2px 8px}
.stop .berries{background:rgba(255,255,255,.75);border-radius:99px;padding:4px 8px;margin-top:2px}
.stop .num{position:absolute;top:2px;left:44px;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--disp);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;z-index:2}
.stop.done .pad{border-color:#FFD34D;box-shadow:0 8px 0 #E0A100,0 0 0 6px rgba(255,201,60,.35),0 14px 18px rgba(27,58,46,.25)}
.stop .medal{position:absolute;top:2px;right:44px;width:40px;height:40px;z-index:2;animation:spin 8s linear infinite}
.stop.next .pad{animation:float 4s ease-in-out infinite,glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 8px 0 var(--leafd),0 0 0 14px rgba(255,201,60,.55),0 14px 18px rgba(27,58,46,.25)}}
@keyframes float{50%{transform:translateY(-8px)}}
.stop .sitdot{position:absolute;top:-30px;right:12px;width:64px;height:64px;z-index:3}
.here{position:absolute;top:-52px;right:-8px;background:var(--red);color:#fff;font-weight:800;font-size:13px;border-radius:10px;padding:3px 8px;white-space:nowrap;animation:float 1.4s ease-in-out infinite}

/* ---------- lab panel ---------- */
.panel{position:relative;margin-top:62px;background:var(--paper);border:5px solid var(--leaf);border-radius:34px;padding:22px 26px 24px;box-shadow:0 10px 0 var(--leafd),0 22px 40px rgba(27,58,46,.22)}
.panel:before{content:"";position:absolute;left:-26px;top:-26px;width:78px;height:62px;background:var(--leaf);border-radius:0 100% 0 100%;transform:rotate(-18deg);box-shadow:inset -6px -6px 0 var(--leafd)}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;padding-left:34px}
.phead .ttl{font-family:var(--disp);font-weight:700;font-size:24px;color:var(--leafd)}
.phead .sp{flex:1}
.chip{background:#EAF8E4;border:2.5px solid var(--leaf);border-radius:99px;padding:3px 12px;font-weight:800;font-size:14px;color:var(--leafd)}
.say{border:3px solid var(--sky);background:#fff;color:var(--sky);border-radius:14px;padding:5px 12px;font-weight:800;font-size:15px;box-shadow:0 3px 0 #1E6FAA}
.say:active{transform:translateY(3px);box-shadow:none}
.say svg{width:18px;height:18px;vertical-align:-3px;margin-right:4px}
.vine{position:relative;height:26px;margin:8px 0 14px;border-radius:99px;background:#EAF3E4;border:3px solid #D4E9C9}
.vine .grow{position:absolute;left:0;top:50%;height:8px;margin-top:-4px;border-radius:99px;background:var(--leaf);transition:width .7s var(--pop)}
.vine .grow:after{content:"";position:absolute;right:-2px;top:-9px;width:16px;height:12px;background:var(--leaf);border-radius:0 100% 0 100%}
.vine .crawler{position:absolute;top:-16px;width:52px;height:52px;margin-left:-26px;transition:left .7s var(--pop);transform:rotate(90deg);z-index:2}
.help{font-weight:700;font-size:16px;color:#3E6B52;margin-top:2px}
.stem{font-family:var(--disp);font-weight:600;font-size:clamp(22px,3.4vw,30px);line-height:1.25;margin:8px 0 14px}
.stem b{color:var(--red);font-weight:700}
.qimg{display:flex;justify-content:center;margin:0 0 14px}
.qimg svg{max-width:100%;height:auto;animation:pop .5s var(--pop) both}
.qimg svg.scene{width:380px;border-radius:18px;border:4px solid #fff;box-shadow:0 6px 0 rgba(27,58,46,.15)}
.opts{display:grid;gap:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:#fff;border:3.5px solid #CFE6C6;border-radius:20px;padding:13px 16px;font-size:20px;font-weight:800;
 box-shadow:0 6px 0 #CFE6C6;transition:transform .12s,box-shadow .12s,background .2s;animation:pop .45s var(--pop) both}
.opt:hover{transform:translateY(-2px);border-color:var(--leaf);box-shadow:0 8px 0 var(--leaf)}
.opt:active{transform:translateY(5px);box-shadow:0 1px 0 var(--leaf)}
.opt .l{flex:none;width:40px;height:40px;border-radius:50%;background:var(--sky2);border:3px solid var(--sky);color:var(--sky);font-family:var(--disp);font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
.opt.sel{background:#E3F2FF;border-color:var(--sky);box-shadow:0 6px 0 var(--sky)}.opt.sel .l{background:var(--sky);color:#fff}
.opt.ok .l,.opt.no .l{font-size:0}.opt.ok .l:after{content:"\2713";font-size:22px}.opt.no .l:after{content:"\2715";font-size:20px}
.opt.ok{background:#E3F8DC;border-color:var(--leaf);box-shadow:0 6px 0 var(--leafd);animation:okpop .5s var(--pop)}.opt.ok .l{background:var(--leaf);border-color:var(--leaf);color:#fff}
.opt.no{background:#FFEDEA;border-color:var(--red);box-shadow:0 6px 0 var(--redd);animation:shake .45s}.opt.no .l{background:var(--red);border-color:var(--red);color:#fff}
.opt[disabled]{cursor:default}
.opt[disabled]:hover{transform:none}
@keyframes okpop{40%{transform:scale(1.05)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.fb{margin-top:14px;border-radius:18px;padding:12px 16px;font-size:18px;font-weight:700;line-height:1.4;animation:pop .45s var(--pop) both}
.fb.ok{background:#E3F8DC;border:3px solid var(--leaf)}.fb.no{background:#FFF4DA;border:3px solid var(--sun2)}
.fb b{font-family:var(--disp);font-weight:700;font-size:20px}
.nav{display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}.nav .sp{flex:1}
.btn{border:0;border-radius:18px;padding:13px 24px;font-family:var(--disp);font-weight:700;font-size:20px;color:#fff;background:var(--sky);box-shadow:0 6px 0 #1E6FAA;transition:transform .1s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #1E6FAA}
.btn.go{background:var(--leaf);box-shadow:0 6px 0 var(--leafd)}.btn.go:active{box-shadow:0 1px 0 var(--leafd)}
.btn.red{background:var(--red);box-shadow:0 6px 0 var(--redd)}
.btn.alt{background:#fff;color:var(--sky);border:3px solid var(--sky)}
.btn[disabled]{opacity:.35;cursor:default;transform:none}
.btn.wiggle{animation:wig 1.2s ease-in-out infinite}
@keyframes wig{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-4deg)}85%{transform:rotate(4deg)}}

/* learn */
.limg{display:flex;justify-content:center;margin:6px 0 14px;min-height:120px}
.limg svg{max-width:100%;height:auto}
.limg svg.scene{width:420px;border-radius:20px;border:4px solid #fff;box-shadow:0 6px 0 rgba(27,58,46,.15)}
.limg svg > g{animation:popin .6s var(--pop) both}
@keyframes popin{from{transform:scale(.3);opacity:0}}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lb li{position:relative;padding:10px 14px 10px 52px;background:#F4FBF0;border-radius:16px;font-size:19px;line-height:1.45;animation:slidein .5s var(--pop) both}
.lb li:before{content:"";position:absolute;left:14px;top:13px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#1B1B1B 0 22%,transparent 24%),var(--red);
 background-size:100% 100%;box-shadow:inset 7px -6px 0 -4px #1B1B1B,inset -7px 6px 0 -4px #1B1B1B}
.lb b{color:var(--leafd)}
@keyframes slidein{from{transform:translateX(-30px);opacity:0}}
.qc{margin-top:18px;background:linear-gradient(135deg,#FFF6D6,#FFFBEA);border:3px dashed var(--sun2);border-radius:22px;padding:14px 16px}
.qc .qs{font-family:var(--disp);font-weight:600;font-size:22px;margin-bottom:10px}

/* order games */
.slots{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin:12px 0;min-height:150px;background:radial-gradient(ellipse at 50% 100%,#DFF5D5,#F3FBEF 70%);border:3px dashed #9ED38C;border-radius:24px;padding:14px;position:relative}
.slot{width:118px;height:132px;border:3.5px dashed #9ED38C;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;font-family:var(--disp);font-weight:700;font-size:16px;color:#7FAF73;position:relative}
.slot .ic{width:84px;height:84px}
.slot.fill{border-style:solid;border-color:var(--leaf);color:var(--ink);animation:land .45s var(--pop)}
.slot.sunslot{border-color:var(--sun);border-style:solid;color:var(--ink);background:#FFF8DE}
@keyframes land{from{transform:translateY(-40px) scale(.6)}}
.arr{width:34px;height:24px;flex:none}
.pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px}
.piece{width:128px;height:140px;background:#fff;border:3.5px solid #CFE6C6;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:17px;box-shadow:0 7px 0 #CFE6C6;animation:pop .5s var(--pop) both;transition:transform .15s}
.piece .ic{width:90px;height:90px}
.piece:hover{transform:translateY(-4px) rotate(-3deg);border-color:var(--leaf);box-shadow:0 10px 0 var(--leaf)}
.piece[disabled]{opacity:.18;transform:scale(.85);box-shadow:none}
.orb{position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle,#fff 0 25%,#FFE071 45%,rgba(255,201,60,0) 72%);z-index:58;pointer-events:none;box-shadow:0 0 18px 8px rgba(255,201,60,.65)}
.zap{animation:zap .5s var(--pop)}
@keyframes zap{40%{transform:scale(1.18);box-shadow:0 0 0 10px rgba(255,201,60,.45)}}
.m-egg .ic{animation:eggw .5s ease-in-out 3}
@keyframes eggw{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.m-larva .ic{animation:crawl 1.2s ease-in-out}
@keyframes crawl{30%{transform:translateX(12px) scaleX(1.1)}60%{transform:translateX(-10px) scaleX(.92)}}
.m-pupa .ic{animation:wrig .25s ease-in-out 5 alternate}
@keyframes wrig{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.m-adult .ic{animation:takeoff 1.4s ease-in-out}
@keyframes takeoff{30%{transform:translateY(-30px) rotate(-14deg) scale(1.15)}60%{transform:translate(20px,-50px) rotate(16deg) scale(1.15)}}

/* results */
.result{text-align:center}
.bigflower{position:relative;width:220px;height:220px;margin:6px auto 4px}
.bigflower .ring{position:absolute;inset:0;animation:spin 24s linear infinite}
.bigflower .pet{position:absolute;left:50%;top:50%;width:66px;height:104px;margin:-104px 0 0 -33px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform-origin:50% 100%;background:var(--sun)}
.bigflower .core{position:absolute;inset:48px;border-radius:50%;background:#fff;border:7px solid #F59E0B;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp)}
.bigflower .core b{font-size:50px;line-height:1;color:var(--leafd)}.bigflower .core span{font-weight:600;font-size:15px}
.stars3{display:flex;justify-content:center;gap:14px;margin:10px 0}
.stars3 svg{width:64px;height:64px}
.stars3 .on{animation:stardrop .7s var(--pop) both}
@keyframes stardrop{from{transform:translateY(-140px) rotate(-200deg) scale(.3);opacity:0}}
.rtitle{font-family:var(--disp);font-weight:700;font-size:34px;margin:4px 0;color:var(--leafd)}
.rmsg{font-size:20px;font-weight:700}
.bars{display:grid;gap:9px;margin:16px auto 6px;max-width:640px;text-align:left}
.bar{display:grid;grid-template-columns:190px 1fr 50px;gap:10px;align-items:center;font-weight:800;font-size:16px}
.bar .t{height:20px;background:#EAF3E4;border-radius:99px;overflow:hidden;border:2.5px solid #D4E9C9}
.bar .t i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),#8FD97D);border-radius:99px;animation:fillbar 1.1s var(--pop) both}
@keyframes fillbar{from{width:0!important}}
.miss{border:3px solid #FFD0C9;background:#FFF7F5;border-radius:20px;padding:12px 16px;margin:12px 0;font-size:17px;text-align:left}
.miss .r{color:#1E7A3E;font-weight:800}.miss .y{color:var(--redd);font-weight:800}

/* flashcards */
.deckwrap{perspective:1600px;position:relative;margin-top:6px}
.fcard{position:relative;width:100%;height:440px;cursor:pointer;transform-style:preserve-3d;transition:transform .6s var(--pop)}
.fcard.flip{transform:rotateY(180deg)}
.fcard.flingR{animation:flingR .55s ease-in forwards}.fcard.flingD{animation:flingD .55s ease-in forwards}
.fcard.inn{animation:dealin .55s var(--pop) both}
@keyframes flingR{to{transform:translateX(130%) rotate(28deg);opacity:0}}
@keyframes flingD{to{transform:translateY(60%) scale(.6) rotate(-10deg);opacity:0}}
@keyframes dealin{from{transform:translateY(-60px) rotate(-8deg) scale(.85);opacity:0}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px;border:5px solid var(--leaf);background:#fff;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 8px 0 var(--leafd)}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#F2FBEE,#FFFFFF)}
.face .art{height:190px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.face .art svg{max-height:190px;width:auto;max-width:100%}
.face .art svg.scene{width:300px;height:auto;border-radius:16px}
.word{font-family:var(--disp);font-weight:700;font-size:46px;color:var(--leafd);line-height:1}
.def{font-size:23px;font-weight:800;line-height:1.35;margin:8px 0 12px}
.ex{font-size:18px;background:#FFF6D6;border:3px dashed var(--sun2);border-radius:16px;padding:8px 12px;margin-bottom:8px;width:100%;font-weight:700}
.trick{font-size:18px;background:#E3F8DC;border:3px solid var(--leaf);border-radius:16px;padding:8px 12px;width:100%;font-weight:700}
.mini{font-family:var(--disp);font-weight:600;font-size:14px;color:#9A5B00}.trick .mini{color:var(--leafd)}
.tapme{margin-top:12px;font-weight:800;color:#5E8A6E;animation:float 1.6s ease-in-out infinite}

/* test dots as ladybug spots */
.spots{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}
.spot{width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:#F0D7D3;font-weight:800;font-size:13px;color:#7A3B35;box-shadow:0 3px 0 rgba(27,58,46,.15)}
.spot.ans{background:var(--red);color:#fff}
.spot.cur{outline:4px solid var(--sun);outline-offset:1px;transform:scale(1.12)}

 .top h1{font-size:19px}.top .mini{width:34px;height:34px}.jar{font-size:17px;padding:3px 10px 3px 6px}.tbtn{padding:5px 8px;font-size:14px}
 #app{padding:12px 10px 150px}
 .panel{padding:18px 14px 20px;border-radius:26px}.panel:before{left:-12px;top:-18px;width:54px;height:44px}

 .fcard{height:480px}.word{font-size:38px}

}

 *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

/* ========== REFRESHED MULTI-UNIT DESIGN SYSTEM ========== */
:root {
  --sky1: #7EC8FF;
  --sky2: #EAF6FF;
  --sun: #FFC53D;
  --sun2: #F5A623;
  --leaf: #3CB371;
  --leafd: #1E7A4A;
  --red: #E85A4F;
  --redd: #C73E36;
  --ink: #1A2B3C;
  --sky: #2B7DE9;
  --paper: #FFFFFF;
  --card: #FFFFFF;
  --muted: #5A6B7D;
  --accent: var(--leaf);
  --accent-d: var(--leafd);
  --bg-soft: #F4FBFF;
  --shadow: 0 8px 24px rgba(26,43,60,.08);
  --radius: 20px;
}

body {
  background: linear-gradient(180deg, #EAF6FF 0%, #F8FCFF 40%, #F3FFE8 100%);
  color: var(--ink);
  font-weight: 600;
}

/* Softer living world */
#world {
  background: linear-gradient(180deg, #7EC8FF 0%, #C8E9FF 35%, #EAF6FF 60%, #F5FFF0 100%);
  opacity: .85;
}
.hill { opacity: .7; }
.blade, .flower { opacity: .6; }
.walker { opacity: .75; }

/* Top bar – cleaner */
.top {
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(43,125,233,.12);
  box-shadow: 0 2px 12px rgba(26,43,60,.04);
  padding: 8px 14px;
}
.top h1 {
  font-size: 22px;
  letter-spacing: -0.3px;
  color: var(--ink);
}
.jar {
  background: #FFF;
  border: 2px solid var(--sun);
  box-shadow: 0 2px 0 var(--sun2);
  font-size: 18px;
}
.tbtn {
  border: 2px solid #D0E4F5;
  background: #FFF;
  border-radius: 12px;
  box-shadow: 0 2px 0 #D0E4F5;
  color: var(--sky);
}
.tbtn:active { transform: translateY(1px); box-shadow: none; }

/* Panels – modern cards */
.panel {
  background: var(--card);
  border: none;
  border-radius: 28px;
  box-shadow: var(--shadow), 0 1px 0 rgba(255,255,255,.8) inset;
  padding: 24px 22px 26px;
  margin-top: 48px;
}
.panel:before { display: none; }
.phead .ttl {
  font-size: 26px;
  color: var(--ink);
  letter-spacing: -0.4px;
}
.chip {
  background: var(--bg-soft);
  border: 1.5px solid #D0E4F5;
  color: var(--sky);
  font-size: 13px;
  padding: 4px 10px;
}

/* Buttons */
.btn {
  border-radius: 16px;
  padding: 14px 22px;
  font-size: 18px;
  box-shadow: 0 4px 0 var(--sky);
  transition: transform .1s, box-shadow .1s;
}
.btn.go { background: var(--accent); box-shadow: 0 4px 0 var(--accent-d); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sky); }
.btn.go:active { box-shadow: 0 1px 0 var(--accent-d); }

/* Options */
.opt {
  border: 2px solid #E4EEF5;
  border-radius: 18px;
  box-shadow: 0 3px 0 #E4EEF5;
  background: #FFF;
  transition: all .15s;
}
.opt:hover { border-color: var(--sky); transform: translateY(-1px); }
.opt.ok { background: #E8F8EE; border-color: var(--leaf); box-shadow: 0 3px 0 var(--leafd); }
.opt.no { background: #FFF0EE; border-color: var(--red); box-shadow: 0 3px 0 var(--redd); }

/* Home blooms – cleaner */
.bloom .head {
  filter: drop-shadow(0 6px 8px rgba(26,43,60,.12));
}
.bloom .nm {
  background: rgba(255,255,255,.95);
  border: 1px solid rgba(26,43,60,.06);
  box-shadow: 0 2px 6px rgba(26,43,60,.06);
}
.bloom .ds {
  background: rgba(255,255,255,.85);
  color: var(--muted);
}

/* Trail stops */
.stop .pad {
  box-shadow: 0 6px 0 var(--leafd), 0 10px 16px rgba(26,43,60,.12);
  border: 4px solid #FFF;
}
.stop .nm {
  background: #FFF;
  border: 1px solid rgba(26,43,60,.06);
  box-shadow: 0 2px 6px rgba(26,43,60,.05);
}

/* Unit theming */
body.unit-water {
  --accent: #2B7DE9;
  --accent-d: #1A5BB8;
}
body.unit-water .btn.go { background: var(--accent); box-shadow: 0 4px 0 var(--accent-d); }
body.unit-water .stop .pad { box-shadow: 0 6px 0 #1A5BB8, 0 10px 16px rgba(26,43,60,.12); }
body.unit-water .chip { color: #1A5BB8; border-color: #B3D4FF; background: #F0F7FF; }

/* Flashcards */
.fcard .face {
  border: none;
  border-radius: 24px;
  box-shadow: var(--shadow);
}
.word { font-size: 42px; letter-spacing: -0.5px; }

/* Results */
.bigflower .core { border-color: var(--sun); }
.rtitle { letter-spacing: -0.5px; }

/* Night mode refinements */
body.night {
  background: #0C1420;
  color: #E8F0FA;
}
body.night .panel { background: #1A2433; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
body.night .opt { background: #243044; border-color: #3A4A60; color: #E8F0FA; }
body.night .top { background: rgba(12,20,32,.92); border-bottom-color: rgba(100,160,255,.15); }
body.night .stem, body.night .help, body.night .lb li { color: #D0E0F0; }

@media (max-width: 700px) {
  .panel { padding: 18px 16px 20px; border-radius: 22px; margin-top: 40px; }
  .top h1 { font-size: 18px; }
  .btn { font-size: 16px; padding: 12px 18px; }
}

/* ===== Daily 5, garden, grown-ups report ===== */
.dailyrow{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:18px auto 0;max-width:820px;position:relative;z-index:2}
.dcard{flex:1 1 300px;max-width:400px;display:flex;align-items:center;gap:14px;background:var(--paper);border:4px solid var(--sun2);border-radius:26px;padding:14px 18px;box-shadow:0 7px 0 #D98C00,0 16px 30px rgba(26,43,60,.12);font:inherit;color:var(--ink);cursor:pointer;text-align:left;transition:transform .12s;animation:dpop .6s var(--pop,cubic-bezier(.3,1.6,.5,1)) both}
.dcard:hover{transform:translateY(-3px) rotate(-.5deg)}.dcard:active{transform:translateY(3px)}
.dcard .di{width:62px;height:62px;flex:none}.dcard .di svg{width:100%;height:100%}
.dcard b{font-family:var(--disp);font-size:24px;display:block;line-height:1.1}
.dcard small{display:block;font-weight:700;font-size:15px;color:var(--muted,#5A6B7D);margin-top:3px}
.dcard.gard{border-color:var(--leaf);box-shadow:0 7px 0 var(--leafd),0 16px 30px rgba(26,43,60,.12);animation-delay:.12s}
.dcard.done{border-color:#7CC77F}
.dbadge{display:inline-block;background:var(--red);color:#fff;border-radius:999px;padding:1px 10px;font-size:15px;font-family:var(--disp);margin-left:6px;vertical-align:3px}
.dbadge.ok{background:var(--leaf)}
.flame{display:inline-block;background:#FFF1C9;border:2px solid var(--sun2);color:#8A5200;border-radius:999px;padding:0 9px;font-size:14px;font-weight:800;margin-left:4px}
@keyframes dpop{from{opacity:0;transform:scale(.85) translateY(14px)}to{opacity:1;transform:none}}
.grownups{display:block;margin:22px auto 40px;background:rgba(255,255,255,.75);border:2px solid #CFE3D2;border-radius:999px;padding:7px 18px;color:var(--leafd);font-weight:800;font-size:15px;cursor:pointer;position:relative;z-index:2}
.gintro{text-align:center;font-weight:700;font-size:18px;margin:0 auto 12px;max-width:620px}
.sunrow{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:6px 0 16px;min-height:44px}
.sunrow svg{width:42px;height:42px}
.gbed{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;background:linear-gradient(180deg,#F2FBEA,#E2F2D4);border:3px solid #CFE6BE;border-radius:24px;padding:14px;margin:8px 0 14px}
.gf{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:800;text-align:center;color:#3B5A44;line-height:1.15}
.gf svg{width:64px;height:72px}
.gf.gfb svg{animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.gtag{display:inline-block;margin-top:2px;padding:1px 7px;border-radius:99px;background:#fff;border:1.5px solid #D7E6CC}
.gtag.ready{background:#E3F2FF;border-color:#90C4F0;color:#1E5C99}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:14px;margin-bottom:6px}
.rep h3{font-family:var(--disp);font-size:22px;margin:18px 0 8px;color:var(--leafd)}
.rep .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.rep .day{border:2.5px solid #D9E8DA;border-radius:14px;padding:6px 2px;font-weight:800;font-size:13px;background:#F8FCF6}
.rep .day b{display:block;font-size:20px;font-family:var(--disp)}
.rep .day.d5{border-color:var(--sun2);background:#FFF8E1}
.rep .day.today{outline:3px solid var(--sky);outline-offset:1px}
.rep .kpis{display:flex;gap:10px;flex-wrap:wrap}
.rep .kpi{flex:1 1 140px;border:2.5px solid #D9E8DA;border-radius:16px;padding:10px 12px;background:#F8FCF6;font-weight:700;font-size:14px}
.rep .kpi b{display:block;font-family:var(--disp);font-size:28px;color:var(--ink)}
.rep .bar .t i.mid{background:linear-gradient(90deg,#F5A623,#FFD27A)}
.rep .bar .t i.low{background:linear-gradient(90deg,#E85A4F,#FF9C8F)}
.rep .ubtns{display:flex;gap:8px;flex-wrap:wrap}
.rep .ubtns button{border:2.5px solid #CFE3D2;background:#fff;border-radius:14px;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer;color:var(--ink)}
.rep .ubtns button.on{background:var(--leaf);border-color:var(--leafd);color:#fff}
.rep .note{font-size:14px;color:var(--muted,#5A6B7D);font-weight:700}
.rep .uhead{font-weight:800;margin:10px 0 2px}

/* ===== round 2: labs, countdown, my questions, print sheet ===== */
.dailyrow.small .dcard{flex:1 1 220px;max-width:300px;padding:10px 14px;border-width:3px}
.dailyrow.small .dcard b{font-size:20px}.dailyrow.small .dcard .di{width:48px;height:48px}
.dcard.lab{border-color:#5EC4FF;box-shadow:0 6px 0 #2E8FD0,0 14px 26px rgba(26,43,60,.1);animation-delay:.2s}
.dcard.myq{border-color:#B88CFF;box-shadow:0 6px 0 #7E57C2,0 14px 26px rgba(26,43,60,.1);animation-delay:.26s}
.dcard.count{flex-basis:100%;max-width:816px;border-color:var(--red);box-shadow:0 7px 0 #B8382E,0 16px 30px rgba(26,43,60,.12);background:linear-gradient(90deg,#FFF4F2,var(--paper))}
.dcard.count .big{font-family:var(--disp);font-size:40px;color:var(--red);line-height:1;min-width:64px;text-align:center}
.dcard.count .big small{font-size:13px;color:var(--red);margin:0}
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.labcard{display:flex;gap:12px;align-items:center;text-align:left;background:#F5FBFF;border:3px solid #BFE3FA;border-radius:20px;padding:12px;font:inherit;color:var(--ink);cursor:pointer;transition:transform .12s}
.labcard:hover{transform:translateY(-3px)}.labcard .di{width:54px;height:54px;flex:none}.labcard .di svg{width:100%;height:100%}
.labcard b{font-family:var(--disp);font-size:19px;display:block}.labcard small{font-weight:700;color:var(--muted,#5A6B7D)}
.labcard.done{background:#F1FAEE;border-color:#A8D8A0}
.utabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.utabs button{border:2.5px solid #CFE3D2;background:#fff;border-radius:14px;padding:7px 13px;font:inherit;font-weight:800;cursor:pointer;color:var(--ink)}
.utabs button.on{background:var(--sky,#2F80ED);border-color:#1B5FB8;color:#fff}
.labsec{background:#F8FCFF;border:2.5px solid #D6EAF7;border-radius:18px;padding:12px 16px;margin:10px 0}
.labsec h4{font-family:var(--disp);font-size:20px;margin:0 0 6px;color:#1E5C99}
.labsec ul{margin:0;padding-left:22px;font-weight:700;line-height:1.5}
.steps{list-style:none;padding:0!important}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;cursor:pointer;border-radius:10px}
.steps li .ck{flex:none;width:26px;height:26px;border:3px solid #90C4F0;border-radius:8px;display:grid;place-items:center;font-weight:900;color:#fff}
.steps li.on .ck{background:var(--leaf);border-color:var(--leafd)}.steps li.on{color:#5A6B7D;text-decoration:line-through}
.pred{display:flex;gap:8px;flex-wrap:wrap}
.pred button{border:2.5px solid #CFE3D2;background:#fff;border-radius:14px;padding:8px 12px;font:inherit;font-weight:800;cursor:pointer;color:var(--ink)}
.pred button.on{background:#FFF1C9;border-color:var(--sun2)}
.grownup{display:inline-block;background:#FFF1C9;border:2px solid var(--sun2);border-radius:99px;padding:2px 10px;font-weight:800;font-size:13px;color:#8A5200}
.reveal{background:#F1FAEE;border:3px solid #A8D8A0;border-radius:18px;padding:12px 16px;margin-top:10px;animation:dpop .5s both}
.reveal h4{color:var(--leafd)}
.mqform label{display:block;font-weight:800;margin:10px 0 4px}
.mqform input,.mqform textarea{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:10px 12px;border:3px solid #D9CCF5;border-radius:14px;background:#fff;color:#1d2b3a}
.mqform textarea{min-height:70px;resize:vertical}
.mqform .ok input{border-color:#A8D8A0}.mqform .wr input{border-color:#F5B7B0}
.tipbox{background:#F6F0FF;border:2.5px dashed #B88CFF;border-radius:16px;padding:10px 14px;font-weight:700;margin:6px 0 4px}
.myitem{border:2.5px solid #E2D7F7;border-radius:14px;padding:8px 12px;margin:6px 0;display:flex;gap:10px;align-items:flex-start}
.myitem div{flex:1}.myitem button{border:0;background:#FDECEA;color:#B8382E;border-radius:10px;font-weight:800;padding:6px 10px;cursor:pointer;font:inherit}
.rep .setrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rep input[type=date]{font:inherit;font-weight:700;padding:7px 10px;border:2.5px solid #CFE3D2;border-radius:12px}
.toggle{display:inline-flex;gap:8px;align-items:center;font-weight:800;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--leaf)}
.psheet{background:#fff;color:#111;max-width:8in;margin:24px auto;padding:.45in .5in;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.15);font-family:Nunito,system-ui,sans-serif;position:relative;z-index:2}
.psheet .ph{display:flex;align-items:center;gap:12px;border-bottom:3px solid #E85A4F;padding-bottom:6px;margin-bottom:8px}
.psheet .ph h2{font-family:var(--disp);font-size:26px;margin:0;flex:1}
.psheet .ph svg{width:46px;height:46px}
.psheet .meta{display:flex;gap:24px;font-weight:700;font-size:14px;margin-bottom:8px}
.psheet .meta span{flex:1;border-bottom:1.5px solid #999;padding-bottom:2px}
.psheet .pq{break-inside:avoid;padding:6px 0 8px;border-bottom:1px dashed #CCC}
.psheet .pq .s{font-weight:800;font-size:15px}
.psheet .pq .s i{font-style:normal;display:inline-block;width:22px;height:22px;border-radius:50%;background:#E85A4F;color:#fff;text-align:center;line-height:22px;margin-right:6px;font-size:13px}
.psheet .pq .o{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:14px;margin:4px 0 0 28px}
.psheet .pq .o span:before{content:attr(data-l);display:inline-block;width:18px;height:18px;border:1.6px solid #333;border-radius:50%;text-align:center;line-height:18px;font-size:11px;font-weight:800;margin-right:6px}
.psheet .pq .tp{font-size:11px;color:#777;margin-left:28px}
.psheet .key{margin-top:10px;padding-top:6px;border-top:2px dashed #999;font-size:12px;color:#444}
.psheet .key b{font-family:var(--disp)}
.psheet .tools{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
@media print{
  @page{size:letter;margin:0}
  body{background:#fff!important}
  body > *:not(main){display:none!important}
  main#app > *:not(.psheet){display:none!important}
  main#app{padding:0!important;margin:0!important;min-height:0!important}
  .psheet{box-shadow:none;margin:0;max-width:none;border-radius:0;padding:.35in .5in}
  .psheet .pq{padding:4px 0 5px}
  .psheet .tools{display:none!important}
}
body.night .labcard{background:#1E3044;border-color:#36506A;color:#E0F0FF}
body.night .labsec{background:#1E3044;border-color:#36506A}
body.night .labsec h4{color:#9CCBF5}
@media (max-width:520px){.dailyrow.small{gap:10px}.dailyrow.small .dcard{flex:1 1 40%;max-width:none;padding:8px 10px;gap:8px;flex-direction:column;text-align:center}.dailyrow.small .dcard .di{width:40px;height:40px}.dailyrow.small .dcard b{font-size:17px}.dailyrow.small .dcard small{font-size:12px}.dcard.count .big{font-size:32px;min-width:48px}.psheet{padding:16px}.psheet .pq .o{grid-template-columns:1fr}}
.limg svg.ic{width:210px!important;height:210px!important;max-width:60vw}

ll=\"#f48fb1\" transform=\"rotate(-35 34 46)\"/><ellipse cx=\"58\" cy=\"46\" rx=\"6\" ry=\"11\" fill=\"#f48fb1\" transform=\"rotate(35 58 46)\"/></g><g transform=\"translate(100 82) scale(0.18)\"><ellipse cx=\"50\" cy=\"58\" rx=\"40\" ry=\"16\" fill=\"#43a047\"/><path d=\"M50 58 L84 46 Q96 56 84 66Z\" fill=\"#7ec8ff\"/><ellipse cx=\"46\" cy=\"42\" rx=\"6\" ry=\"12\" fill=\"#f8bbd0\"/><ellipse cx=\"34\" cy=\"46\" rx=\"6\" ry=\"11\" fill=\"#f48fb1\" transform=\"rotate(-35 34 46)\"/><ellipse cx=\"58\" cy=\"46\" rx=\"6\" ry=\"11\" fill=\"#f48fb1\" transform=\"rotate(35 58 46)\"/></g></svg>"},{"s":"Which is a <b>nonliving</b> part of an ecosystem?","o":["frog","sunlight","oak tree","mushroom"],"a":1,"e":"Sunlight, water, soil, air and nutrients are the nonliving parts.","img":""}],"myth":[{"s":"Food chains start with an animal.","o":["Myth","Fact"],"a":0,"e":"Food chains start with a producer (a plant), and the energy comes from the sun.","img":""},{"s":"All deserts are hot and sandy.","o":["Myth","Fact"],"a":0,"e":"A desert is a place with very little rain or snow. Antarctica is a desert, and it's cold!","img":""},{"s":"One animal can change its body to adapt during its own life.","o":["Myth","Fact"],"a":0,"e":"Populations adapt over many, many years. One animal can't change itself.","img":""},{"s":"Only big animals like dinosaurs can become fossils.","o":["Myth","Fact"],"a":0,"e":"Tiny things like pollen and bacteria can become fossils too.","img":""},{"s":"A ladybug larva looks very different from an adult ladybug.","o":["Myth","Fact"],"a":1,"e":"The larva looks like a tiny alligator. It changes a lot in the pupa stage.","img":""},{"s":"Arrows in a food chain point to the animal doing the eating.","o":["Myth","Fact"],"a":1,"e":"The arrow shows energy moving to the eater.","img":""},{"s":"Plants get their food from the soil.","o":["Myth","Fact"],"a":0,"e":"Plants make their own food from sunlight, air and water. Soil gives them water and nutrients.","img":""},{"s":"Decomposers help put nutrients back in the soil.","o":["Myth","Fact"],"a":1,"e":"They break down dead things so the nutrients can be used again.","img":""},{"s":"Camouflage is a behavioral adaptation.","o":["Myth","Fact"],"a":0,"e":"Camouflage is the animal's color or shape, a body feature, so it's physical.","img":""},{"s":"Fossils give clues about what a place was like long ago.","o":["Myth","Fact"],"a":1,"e":"Sea-shell fossils on a mountain mean the land was once under the ocean.","img":""}],"fossil":[{"s":"A <b>fish fossil</b> is found in rock in a desert. What can scientists infer?","o":["The place was once covered by water.","Fish live in deserts today.","Someone dropped a fish there."],"a":0,"e":"Fish need water, so long ago there was water there.","img":"<svg class=\"ic\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" width=\"110\" height=\"110\" style=\"width:110px;height:110px;border:0;background:none\"><path d=\"M6 30 Q4 10 26 8 L74 6 Q96 8 94 30 L96 76 Q94 94 72 94 L26 95 Q4 94 6 72Z\" fill=\"#c9bfae\" stroke=\"#9c8f7a\" stroke-width=\"3\"/><path d=\"M14 22 l10 4 M80 82 l-12 -3 M18 80 l8 -6 M84 20 l-8 6\" stroke=\"#ad9f88\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><path d=\"M18 52 Q40 30 66 44 L86 30 L84 72 L66 58 Q40 74 18 52Z\" fill=\"#b3a68f\" stroke=\"#6f6352\" stroke-width=\"3\"/><path d=\"M24 52 H66\" stroke=\"#6f6352\" stroke-width=\"3\"/><path d=\"M34 42 L36 62 M42 40 L44 64 M50 40 L52 64 M58 42 L59 62\" stroke=\"#6f6352\" stroke-width=\"2\"/><circle cx=\"27\" cy=\"48\" r=\"3\" fill=\"#6f6352\"/></svg>"},{"s":"<b>Sea-shell fossils</b> are found high in Virginia's mountains. What does that tell us?","o":["The land was once under the ocean.","Shells can climb mountains.","It snows on the mountain."],"a":0,"e":"Sea creatures lived there when it was under the ocean, long ago.","img":"<svg class=\"ic\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" width=\"120\" height=\"120\" style=\"width:120px;height:120px;border:0;ba troke-width=\"2.5\" stroke-linecap=\"round\"/><path d=\"M24 78 Q22 36 62 20 Q84 14 80 20 Q76 56 34 74Z\" fill=\"#b3a68f\" stroke=\"#6f6352\" stroke-width=\"3\"/><path d=\"M18 86 L30 72 Q50 50 76 22\" stroke=\"#6f6352\" stroke-width=\"3\" fill=\"none\"/><path d=\"M38 60 L30 48 M46 52 L40 36 M54 44 L50 28 M44 58 L58 56 M52 50 L66 46 M60 40 L72 36\" stroke=\"#6f6352\" stroke-width=\"2\" stroke-linecap=\"round\"/></svg>"},{"s":"Which one is a <b>fossil</b>?","o":["a shell print that turned into rock","a shell you found at the beach today","a toy dinosaur"],"a":0,"e":"A fossil is the remains or print of a living thing from long ago, turned into rock.","img":""},{"s":"A <b>palm tree fossil</b> is found in a very cold place. What can scientists infer?","o":["Long ago the place was warm.","Palm trees love snow.","It was always cold there."],"a":0,"e":"Palm trees need warm weather, so the climate was warmer long ago.","img":""}],"aap":[{"s":"Ladybugs eat aphids, and aphids eat rose plants. What happens to the roses if all the ladybugs disappear?","o":["More aphids eat more roses, so the roses get hurt.","The roses grow better.","Nothing changes.","The aphids disappear too."],"a":0,"e":"With no ladybugs, the aphid population grows, and more aphids eat more roses. A change in one part affects the whole ecosystem.","img":""},{"s":"grass &rarr; grasshopper &rarr; frog &rarr; snake. What might happen if the frogs got sick and many died?","o":["Grasshoppers increase and snakes decrease.","Grasshoppers decrease and snakes increase.","Only the grass changes.","Nothing changes."],"a":0,"e":"Fewer frogs means fewer grasshoppers get eaten (they increase) and the snakes have less food (they decrease).","img":""},{"s":"A meadow turns from green to snowy white for many years. Which rabbits are most likely to survive?","o":["white rabbits","brown rabbits","spotted rabbits","all rabbits equally"],"a":0,"e":"White rabbits are camouflaged on snow, so predators find them less. Over many years the population becomes mostly white.","img":""},{"s":"Why does every food chain begin with a plant?","o":["Plants make their own food using the sun's energy.","Plants are the biggest living things.","Plants eat the soil.","Plants are decomposers."],"a":0,"e":"Only producers can turn sunlight into food. Every other living thing gets energy by eating.","img":""},{"s":"A pond dries up in a long, hot summer. Which animal would have the HARDEST time?","o":["fish","deer","bison","toucan"],"a":0,"e":"Fish need water to live and can't walk to a new pond. Animals that can move may find new water.","img":""},{"s":"What would happen if there were NO decomposers in a forest?","o":["Dead leaves and animals would pile up and the soil would lose nutrients.","Trees would grow faster.","There would be more sunlight.","Animals would stop eating."],"a":0,"e":"Decomposers recycle nutrients. Without them, dead things pile up and plants run short of nutrients.","img":""},{"s":"A woodpecker and a squirrel both want the same tree hole for a home. This is called...","o":["competition","camouflage","migration","hibernation"],"a":0,"e":"Living things often compete for limited resources like food, water and shelter.","img":""},{"s":"A scientist finds a fossil of a sea animal in the middle of a forest. Which is the BEST explanation?","o":["The forest was once covered by ocean water.","Sea animals lived in trees.","The fossil grew there.","A bird carried it there yesterday."],"a":0,"e":"Fossils give clues about past environments. A sea fossil means there was once ocean there.","img":""}],"flash":[{"w":"Life cycle","art":"<svg class=\"ic\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" width=\"170\" height=\"170\" style=\"width:170px;height:170px\"><path d=\"M22 40 L8 32 M20 55 L5 55 M24 70 L10 80 M78 40 L92 32 M80 55 L95 55 M76 70 L90 80\" stroke=\"#222\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M42 18 Q38 6 30 6 M58 18 Q62 6 70 6\" stroke=\"#222\" stroke-width=\"3\" D.flash1 = [
  {w:"Food chain", d:"Shows who eats whom. Energy moves along the arrows.", x:"Grass → grasshopper → bird is a food chain.", m:"Arrows point to the eater!", art: D.icons.grass || ""},
  {w:"Producer", d:"A living thing that makes its own food, usually a plant.", x:"Grass and trees are producers.", m:"Producers produce food!", art: D.icons.plant || ""},
  {w:"Consumer", d:"A living thing that eats other living things.", x:"A grasshopper is a consumer.", m:"Consumers consume!", art: D.icons.grasshopper || ""},
  {w:"Decomposer", d:"Breaks down dead plants and animals and returns nutrients to the soil.", x:"Mushrooms and worms are decomposers.", m:"De-COMPOSE like compost!", art: D.icons.mushroom || ""},
  {w:"Prey", d:"The animal that gets hunted.", x:"A rabbit can be prey for a fox.", m:"Prey gets eaten.", art: D.icons.rabbit_brown || ""},
  {w:"Predator", d:"The animal that hunts other animals.", x:"An owl is a predator of mice.", m:"Predator preys on others.", art: D.icons.owl || ""},
  {w:"Adaptation", d:"A body part or behavior that helps a living thing survive.", x:"A duck's webbed feet are an adaptation.", m:"Adapt to survive!", art: D.icons.duckfoot || ""},
  {w:"Behavioral adaptation", d:"Something an animal does (an action) to survive.", x:"Bird calls or migration are behavioral.", m:"Behavior = action.", art: D.icons.bluebird || ""},
  {w:"Physical adaptation", d:"A body part that helps a living thing survive.", x:"Sharp claws or thick fur are physical.", m:"Physical = body part.", art: D.icons.ladybug || ""},
  {w:"Ecosystem", d:"All the living and nonliving things in an area and how they interact.", x:"A pond is an aquatic ecosystem.", m:"Eco = home.", art: D.icons.plant || ""},
  {w:"Aquatic", d:"Related to water. An aquatic ecosystem is in water.", x:"Ocean and pond are aquatic.", m:"Aqua = water.", art: D.icons.whale || ""},
  {w:"Terrestrial", d:"Related to land. A terrestrial ecosystem is on land.", x:"Forest and desert are terrestrial.", m:"Terra = land.", art: D.icons.grass || ""},
  {w:"Fossil", d:"The remains or print of a living thing from long ago, turned to rock.", x:"A shell fossil in a mountain shows the area was once under the ocean.", m:"Fossils are clues.", art: D.icons.fossil_shell || ""},
  {w:"Population", d:"A group of the same kind of living thing living in the same place.", x:"All the ladybugs in one garden are a population.", m:"Same kind, same place.", art: D.icons.ladybug || ""},
  {w:"Migration", d:"A long trip to another place when the seasons change.", x:"Some birds migrate south for winter.", m:"Migrate = move far.", art: D.icons.bluebird || ""},

D.flash2 = [

  {w:"Evaporation", d:"When liquid water turns into water vapor (gas) because of heat from the sun.", x:"A puddle dries up on a sunny day because of evaporation.", m:"Water escapes into the air!", art: D.icons.sun || ""},
  {w:"Condensation", d:"When water vapor cools and turns back into liquid water. This forms clouds.", x:"A cold drink glass gets wet on the outside from condensation.", m:"Vapor condenses into drops!", art: D.icons.cloud_rain || ""},
  {w:"Precipitation", d:"Water falling from clouds as rain, snow, sleet, or hail.", x:"The rain that waters plants is precipitation.", m:"Precip falls down!", art: D.icons.drop || ""},
  {w:"Collection", d:"Water gathering in oceans, lakes, rivers, ponds, or underground.", x:"Rainwater collects in a lake or flows to a river.", m:"Then the cycle starts again!", art: D.icons.puddle || ""},
  {w:"Water vapor", d:"Water in the gas state. You can't see it.", x:"Evaporation turns liquid water into water vapor.", m:"Vapor = gas form.", art: D.icons.vapor || ""},
  {w:"Reservoir", d:"A place where water is stored (ocean, lake, river, groundwater, etc.).", x:"The ocean is the biggest reservoir of water on Earth.", m:"Reservoir = storage place.", art: D.icons.puddle || ""},
  {w:"Groundwater", d:"Water stored underground in soil and rock.", x:"Wells get water from groundwater.", m:"Ground + water.", art: D.icons.soil || ""},
  {w:"Solid", d:"The state of water when it is ice.", x:"Ice is water in the solid state.", m:"Solid = hard, keeps shape.", art: D.icons.drop || ""},
  {w:"Liquid", d:"The state of water we drink and see in puddles and lakes.", x:"A puddle is liquid water.", m:"Liquid flows.", art: D.icons.drop || ""},
  {w:"Gas", d:"The state of water when it is water vapor.", x:"Steam and water vapor are gas.", m:"Gas spreads out.", art: D.icons.vapor || ""},
  {w:"Conservation", d:"Using water carefully so we don't waste the limited clean water.", x:"Turning off the faucet while brushing teeth is conservation.", m:"Conserve = save.", art: D.icons.drop || ""}

D.learn4 = [
  {t:"What Is a Simple Machine?", img: D.icons.lever, b:["A <b>simple machine</b> is a tool that makes work easier.","It can change the <b>size</b> or the <b>direction</b> of a force.","There are six kinds: lever, pulley, inclined plane, wedge, wheel and axle, and screw.","Machines do not make less work. They change how much force you need or which way you push.","Fact: Almost every tool you use is a simple machine or a combination of them!"], q:{s:"A simple machine...", o:["makes work easier by changing force","makes work harder","only works with electricity","is always a computer"], a:0}},
  {t:"Lever & Pulley", img: D.icons.pulley, b:["A <b>lever</b> is a stiff bar that turns on a fulcrum. Examples: seesaw, crowbar, shovel.","It can lift a heavy load with less force.","A <b>pulley</b> is a wheel with a rope. It can change the direction of force (like raising a flag) or reduce the force needed.","Both are used every day at home and school."], q:{s:"A seesaw is a...", o:["lever","pulley","screw","wedge"], a:0}},
  {t:"Inclined Plane, Wedge & Screw", img: D.icons.ramp, b:["An <b>inclined plane</b> (ramp) lets you move something up with less force by going a longer distance.","A <b>wedge</b> is two inclined planes back-to-back. It splits or cuts (axe, knife, doorstop).","A <b>screw</b> is an inclined plane wrapped around a cylinder. It holds things together or lifts.","These machines are all around you!"], q:{s:"A ramp is an example of...", o:["an inclined plane","a lever","a pulley","a wheel"], a:0}},
  {t:"Wheel & Axle + Compound Machines", img: D.icons.wheel, b:["A <b>wheel and axle</b> is a wheel attached to a rod. Turning the wheel turns the axle (doorknob, car wheel, pencil sharpener).","A <b>compound machine</b> is two or more simple machines working together.","Examples: scissors (two levers + wedges), wheelbarrow (lever + wheel and axle), bicycle.","SOL fact: Simple and compound machines have many applications (3.2)."], q:{s:"Scissors are an example of...", o:["a compound machine","only a lever","only a pulley","only soil"], a:0}}

function save(){ try { localStorage.setItem("dotLabG3", JSON.stringify(P)); } catch (e) {} paintStars(); if (typeof cloudPush === "function") cloudPush(); }
function best(k){ return P[k] || 0; }
function award(k, s){ const gain = Math.max(0, s - best(k)); if (s > best(k)) { P[k] = s; save(); } return gain; }
function totalStars(){ let t = 0; for (const k in P) t += P[k] || 0; return t; }
function paintStars(){ $("stars").textContent = totalStars(); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function strip(h){ const d = document.createElement("div"); d.innerHTML = h; return d.textContent; }

function hashStr(t){ let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function qid(q){ return hashStr(strip(q.s) + "|" + q.o[q.a]); }

function dayKey(dt){ dt = dt || new Date(); return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0"); }
function curUnit(){ if (LOG.cu) return LOG.cu; const m = new Date().getMonth(); return m >= 10 || m === 0 ? 2 : m <= 2 ? 3 : m <= 5 ? 4 : 1; }
function logAns(q, ok){
  if (!q || !q.s || !q.o) return;
  const id = qid(q), today = dayKey();
  if (!REG[id]) REG[id] = q;
  const e = LOG.q[id] || (LOG.q[id] = {n: 0, r: 0, w: 0});
  e.n++; e.la = today;
  const d = LOG.d[today] || (LOG.d[today] = {n: 0, r: 0});
  d.n++;
  if (ok) { e.r++; d.r++;
    if (e.w > 0 && !e.m && e.lw !== today && e.fd !== today) { e.fx = (e.fx || 0) + 1; e.fd = today; if (e.fx >= 2) { e.m = 1; e.bloomed = today; } }
  } else { e.w++; e.m = 0; e.fx = 0; e.fd = null; e.lw = today; }
  saveLog();
}
function wilted(){ return Object.keys(LOG.q).filter(id => REG[id] && LOG.q[id].w > 0 && !LOG.q[id].m); }
function bloomed(){ return Object.keys(LOG.q).filter(id => REG[id] && LOG.q[id].w > 0 && LOG.q[id].m); }
function isReady(id){ const e = LOG.q[id], t = dayKey(); return e.lw !== t && e.fd !== t; }
function readyList(){ return wilted().filter(isReady).sort((a, b) => LOG.q[b].w - LOG.q[a].w); }
function streak(){ let n = 0; const dt = new Date(); if (!(LOG.d[dayKey(dt)] || {}).d5) dt.setDate(dt.getDate() - 1);
  while ((LOG.d[dayKey(dt)] || {}).d5) { n++; dt.setDate(dt.getDate() - 1); } return n; }
function d5Days(){ return Object.keys(LOG.d).filter(k => LOG.d[k].d5).length; }
function acc(id){ const e = LOG.q[id]; return e && e.n ? e.r / e.n : -1; }
function pickN(ids, n, taken){ const out = []; for (const id of ids) { if (out.length >= n) break; if (!taken.has(id)) { out.push(id); taken.add(id); } } return out; }

let DAILY = null;
function dailyStart(){
  const cu = curUnit(), taken = new Set(), ids = Object.keys(REG);
  const fix = pickN(readyList(), 2, taken);
  const score = id => { const a = acc(id); return (a < 0 ? .35 : a) + Math.random() * .45; };
  const curPool = ids.filter(id => REG[id].u === cu).sort((a, b) => score(a) - score(b));
  const fk = LOG.focus && LOG.focus.split("|"), focusPool = fk && +fk[0] === cu ? ids.filter(id => REG[id].u === cu && REG[id].tp === fk[1]).sort((a, b) => score(a) - score(b)) : [];
  const cur = pickN(focusPool, 2, taken); cur.push(...pickN(curPool, 3 - cur.length, taken));
  const mine = shuffle(ids.filter(id => REG[id].mine && !taken.has(id))), useMine = mine.length && Math.random() < .5 ? pickN(mine, 1, taken) : [];
  const oldU = ids.filter(id => REG[id].u < cu);
  const oldPool = (oldU.length ? oldU : ids.filter(id => REG[id].u === cu)).sort((a, b) => { const sa = LOG.q[a] ? acc(a) : 1.2, sb = LOG.q[b] ? acc(b) : 1.2; return sa + Math.random() * .5 - (sb + Math.random() * .5); });
  const old = pickN(oldPool, 5 - fix.length - cur.length - useMine.length, taken);
  let all = fix.concat(cur, useMine, old);
  if (all.length < 5) all = all.concat(pickN(shuffle(ids), 5 - all.length, taken));
  DAILY = {fix: new Set(fix)};
  quiz("daily", shuffle(all).map(id => REG[id]), "Dot's Daily 5", "5 quick questions. Some are from older units, so your brain keeps them!");
}

function testInfo(){ if (!LOG.td || !LOG.td.date) return null; const t = new Date(LOG.td.date + "T00:00:00"), now = new Date(); now.setHours(0, 0, 0, 0);

function missionFor(d){
  if (d >= 4) return {k: "mix", t: "Mixed review", d: "8 questions from the whole unit"};

  if (d === 1) return {k: "light", t: "Light review", d: "6 quick questions, then rest"};
  return {k: "day", t: "Test day", d: ""};
}
function weakTopics(u){ const tops = {};
  for (const id in REG) { const q = REG[id]; if (q.u !== u || q.mine) continue; const e = LOG.q[id]; const x = tops[q.tp] || (tops[q.tp] = {n: 0, r: 0}); if (e) { x.n += e.n; x.r += e.r; } }
  return Object.keys(tops).sort((a, b) => { const A = tops[a], B = tops[b]; return (A.n ? A.r / A.n : .6) - (B.n ? B.r / B.n : .6); }); }
function missionStart(){
  const ti = testInfo(); if (!ti || ti.d === 0) return go("home");
  const m = missionFor(ti.d), u = ti.u, ids = Object.keys(REG).filter(id => REG[id].u === u && !REG[id].mine), taken = new Set();

  let pick = [];
  if (m.k === "test") { go(["", "test", "test2", "test3", "test4"][u]); if (typeof T !== "undefined" && T) T.mission = true; return; }
  if (m.k === "mix") pick = pickN(ids.sort((a, b) => sc(a) - sc(b)), 8, taken);
  if (m.k === "weak") { const wt = weakTopics(u).slice(0, 2); pick = pickN(shuffle(wilted().filter(id => REG[id].u === u)), 3, taken); pick = pick.concat(pickN(ids.filter(id => wt.includes(REG[id].tp)).sort((a, b) => sc(a) - sc(b)), 8 - pick.length, taken)); if (pick.length < 8) pick = pick.concat(pickN(ids.sort((a, b) => sc(a) - sc(b)), 8 - pick.length, taken)); }
  if (m.k === "light") { pick = pickN(shuffle(wilted().filter(id => REG[id].u === u)), 2, taken); pick = pick.concat(pickN(shuffle(ids.filter(id => LOG.q[id] && LOG.q[id].r > 0)), 6 - pick.length, taken)); if (pick.length < 6) pick = pick.concat(pickN(shuffle(ids), 6 - pick.length, taken)); }
  quiz("mission", shuffle(pick).map(id => REG[id]), "Mission: " + m.t, ti.d + " day" + (ti.d > 1 ? "s" : "") + " until your " + UNAMES[u] + " test. " + (m.k === "light" ? "Easy does it tonight!" : "Let's get ready!"));
}

/* ================= CLOUD SAVE (claude.ai artifact db; falls back to this browser) ================= */
var CLOUD = {ref: null, state: "local", t: null};
function mergeIn(rp, rl){
  let changed = false;
  for (const k in rp || {}) if ((rp[k] || 0) > (P[k] || 0)) { P[k] = rp[k]; changed = true; }
  if (rl && rl.q) {
    for (const id in rl.q) { const a = LOG.q[id], b = rl.q[id]; if (!a || (b.n || 0) > (a.n || 0)) { LOG.q[id] = b; changed = true; } }
    for (const d in rl.d || {}) { const a = LOG.d[d], b = rl.d[d]; if (!a || (b.n || 0) > (a.n || 0)) { LOG.d[d] = Object.assign({}, b, {d5: (b.d5 || (a && a.d5)) ? 1 : 0}); changed = true; } else if (b.d5 && !a.d5) { a.d5 = 1; changed = true; } }
    if (rl.cu && !LOG.cu) { LOG.cu = rl.cu; changed = true; }
    ["focus","td","ar"].forEach(k => { if (rl[k] !== undefined && LOG[k] === undefined) { LOG[k] = rl[k]; changed = true; } });
    ["md","lp","lab"].forEach(k => { if (rl[k]) { LOG[k] = LOG[k] || {}; for (const x in rl[k]) if (LOG[k][x] === undefined) { LOG[k][x] = rl[k][x]; changed = true; } } });
    if (rl.my && rl.my.length) { LOG.my = LOG.my || []; const have = new Set(LOG.my.map(q => q.s)); rl.my.forEach(q => { if (!have.has(q.s)) { LOG.my.push(q); regMine(q); changed = true; } }); }
  }
  return changed;
}
function cloudPush(){
  if (!CLOUD || !CLOUD.ref) return;
  clearTimeout(CLOUD.t);
  CLOUD.t = setTimeout(() => {
    CLOUD.ref.set({p: JSON.stringify(P), log: JSON.stringify(LOG), at: Date.now()})
      .then(() => { CLOUD.state = "cloud"; })
      .catch(e => { if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { CLOUD.ref = null; CLOUD.state = "local"; } });
  }, 1200);
}
(async function cloudInit(){
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.collection("data/users/" + uid).doc("dotlab");
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej({code: "timeout"}), 10000))]);
    CLOUD.ref = ref; CLOUD.state = "cloud";
    let changed = false;
    if (snap.exists) { const d = snap.data() || {}; let rp = {}, rl = null; try { rp = JSON.parse(d.p || "{}"); rl = JSON.parse(d.log || "null"); } catch (e) {} changed = mergeIn(rp, rl); }
    if (changed) { try { localStorage.setItem("dotLabG3", JSON.stringify(P)); localStorage.setItem("dotLabLog", JSON.stringify(LOG)); } catch (e) {} paintStars(); if (["home","garden","parent","unit1","unit2","unit3","unit4"].includes(curView)) go(curView); }
    cloudPush();
  } catch (e) { CLOUD.ref = null; CLOUD.state = "local"; }
})();
